services:
  chroma:
    image: chromadb/chroma:0.5.5
    container_name: local-llm-chroma
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./storage/chroma:/chroma/chroma
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/heartbeat', timeout=5); sys.exit(0)"
        ]
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 20s

  rag-server:
    image: node:20-slim
    container_name: local-llm-rag-server
    restart: unless-stopped
    working_dir: /app
    network_mode: host
    volumes:
      - ./app:/app
      - ./data:/data:ro
    environment:
      - PORT=3000
      - OLLAMA_HOST=http://127.0.0.1:11434
      - CHROMA_URL=http://127.0.0.1:8000
      - DATA_DIR=/data
      - EMBEDDING_MODEL=nomic-embed-text
      # Fast default + opt-in deep (request "<collection>!deep"). See §5.3.
      - CHAT_MODEL=gemma4:e4b
      - CHAT_MODEL_DEEP=qwen2.5-coder:32b-instruct-q4_K_M
      - CHUNK_SIZE=1000
      - CHUNK_OVERLAP=200
      - CHUNK_CLAUSE_DEPTH=3
      - TOP_K_RESULTS=8
      - CHAT_NUM_CTX=12288
      - CHAT_NUM_CTX_DEEP=12288
      - TOP_K_DEEP=15
      - RAG_GROUNDING=augmented
      # Multi-query expansion (fixes recall on contrastive questions). Uses
      # the fast model for decomposition by default.
      - QUERY_EXPANSION=true
      - MAX_SUBQUERIES=5
      - AUTO_INGEST=true
      # Cross-encoder reranker (sidecar below). RAG degrades to fused order
      # if it is down/slow, so no depends_on is needed.
      - RERANKER_URL=http://127.0.0.1:8008/rerank
      # Phase 4 of the RAG eval: opt-in per-collection routing to the Nemotron
      # embed + rerank sidecar (scripts/nemo-rag/server.py, NOT a compose
      # service -- runs natively in WSL inside scripts/extract/.venv-nemo
      # because Nemotron multimodal models broke under vLLM in Phase 3a).
      # Only collections listed in NEMO_RAG_COLLECTIONS are routed; every
      # other collection keeps using nomic-embed + bge-reranker unchanged.
      # When the sidecar isn't running, those listed collections will fail
      # at embed time -- start the sidecar first:
      #   wsl -e bash -lc "cd /mnt/d/Projects/local-llm/scripts/extract && \
      #     . .venv-nemo/bin/activate && \
      #     export HF_HOME=/mnt/d/Projects/local-llm/storage/nemo-parse/hf-cache && \
      #     python /mnt/d/Projects/local-llm/scripts/nemo-rag/server.py"
      - NEMO_RAG_URL=http://127.0.0.1:8009
      # Per-feature opt-in lists. Full Nemotron (embed+rerank) regressed
      # vs Phase 3a because the multimodal embed lost cross-chapter recall;
      # Phase 4b keeps nomic-embed for first-stage and only routes rerank to
      # Nemotron (where the in-isolation smoke gave +28 score advantage on
      # the §12.29 contrast).
      - NEMO_EMBED_COLLECTIONS=ieee-nemo-rag-tas
      - NEMO_RERANK_COLLECTIONS=ieee-nemo-rag-tas,ieee-nemo-rerank-tas
    command: >
      sh -lc "npm install && node server.js"
    depends_on:
      chroma:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 20s
      timeout: 8s
      retries: 15
      # First boot runs `npm install` then AUTO_INGEST embeds every PDF in
      # every collection; give that a wide grace window before failures count
      # so open-webui (depends_on: rag-server healthy) isn't blocked by a
      # transient early-unhealthy state.
      start_period: 180s

  reranker:
    image: python:3.12-slim
    container_name: local-llm-reranker
    restart: unless-stopped
    working_dir: /app
    network_mode: host
    volumes:
      - ./scripts/reranker:/app
      # Persisted venv + HuggingFace model cache so torch/the reranker model
      # download only once (survives container recreate).
      - ./storage/reranker:/cache
    environment:
      - PORT=8008
      - RERANKER_MODEL=BAAI/bge-reranker-base
      - HF_HOME=/cache/hf
    command: >
      sh -lc "python -m venv /cache/venv 2>/dev/null || true;
              . /cache/venv/bin/activate;
              pip install -q --upgrade pip;
              pip install -q -r requirements.txt;
              exec python server.py"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8008/health', timeout=5); sys.exit(0)"
        ]
      interval: 20s
      timeout: 8s
      retries: 30
      # First boot pip-installs torch + downloads the reranker model.
      start_period: 600s

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: local-llm-open-webui
    restart: unless-stopped
    network_mode: host
    environment:
      - OLLAMA_BASE_URL=http://127.0.0.1:11434
      - WEBUI_AUTH=true
      - PORT=8080
      # Wire Open WebUI's image generation engine to the sd-webui container
      # below. The chat UI's "image" button on any assistant reply POSTs the
      # message text as a prompt to this endpoint. See README → "Image
      # generation". These admin settings can still be overridden per-user in
      # Settings → Images, but defaulting them avoids first-run setup.
      - ENABLE_IMAGE_GENERATION=true
      - IMAGE_GENERATION_ENGINE=automatic1111
      - AUTOMATIC1111_BASE_URL=http://127.0.0.1:7860
      - IMAGE_GENERATION_MODEL=Juggernaut-XL_v9_RunDiffusionPhoto_v2
      - IMAGE_SIZE=1024x1024
      - IMAGE_STEPS=30
    volumes:
      - ./storage/open-webui:/app/backend/data
    depends_on:
      rag-server:
        condition: service_healthy

  # Stable Diffusion WebUI (Automatic1111) — image-generation backend that
  # Open WebUI's per-message "image" button hits. Heavy first boot (clones
  # A1111 + installs torch + xformers, ~10 min); idle CPU thereafter, GPU only
  # during generation. Co-resident with Ollama on the GPU (see README →
  # "Image generation" for the VRAM-coexistence notes vs gemma4 / !deep).
  #
  # Not on network_mode: host because ai-dock's entrypoint binds 0.0.0.0
  # internally; a port mapping is cleaner. Open WebUI (host network) reaches
  # it via 127.0.0.1:7860 just fine.
  sd-webui:
    image: ghcr.io/ai-dock/stable-diffusion-webui:latest-cuda
    container_name: local-llm-sd-webui
    restart: unless-stopped
    ports:
      - "7860:7860"
    # See scripts/sd-webui-entrypoint.sh for the full rationale. Short version:
    # ai-dock's :latest-cuda ships torch 2.4.0+cu121 whose kernels stop at
    # sm_90, so RTX 50-series (Blackwell, sm_120) GPUs fail at generate time
    # with "no kernel image is available for execution on the device". The
    # wrapper pip-upgrades to torch 2.11.0+cu128 (which ships sm_100+sm_120
    # kernels) on every container CREATION, then hands off to ai-dock's
    # normal init.sh. Idempotent: skips when already on a cu128 torch. Pip
    # cache mount below makes repeat installs near-instant.
    entrypoint: ["/bin/bash", "/usr/local/bin/sd-webui-entrypoint.sh"]
    environment:
      # --api enables the REST surface (/sdapi/v1/*) Open WebUI calls.
      # --listen binds 0.0.0.0 so the port mapping actually reaches the WebUI.
      # --cors-allow-origins=* lets the Open WebUI browser tab POST cross-origin.
      # --no-half-vae avoids occasional black-image SDXL+VAE precision bugs.
      # --opt-sdp-attention uses PyTorch's native scaled-dot-product attention
      #   (modern, ~comparable speed to xformers). Required here because the
      #   image's prebuilt xformers (built for torch 2.4.0+cu121) is ABI-
      #   incompatible with our upgraded torch 2.11.0+cu128 and won't load.
      - WEBUI_ARGS=--api --listen --cors-allow-origins=* --no-half-vae --opt-sdp-attention
      - WEB_ENABLE_AUTH=false      # local-only stack; Open WebUI gates LAN.
      - AUTO_UPDATE=false           # pin image; no silent A1111 upgrades on boot.
      # Optional tokens for fetching gated HuggingFace / Civitai models from
      # inside the container (harmless when blank).
      - HF_TOKEN=${HF_TOKEN:-}
      - CIVITAI_TOKEN=${CIVITAI_TOKEN:-}
    volumes:
      # /workspace mount kept for ai-dock's own conventions (Jupyter notebooks,
      # auxiliary scripts) but it does NOT auto-symlink models into A1111's
      # actual model dirs — the ai-dock storage_monitor that's supposed to
      # bridge `${WORKSPACE}/storage/stable_diffusion/models/...` →
      # `/opt/stable-diffusion-webui/models/...` is not enabled in this image.
      # So below we bind-mount the host model dirs DIRECTLY into the A1111
      # paths that the upstream code reads at startup. The host layout matches
      # the workspace convention so `scripts/download-sd-models.ps1` keeps
      # working unchanged and the same `.safetensors` files appear via both
      # paths inside the container.
      - ./storage/sd-webui:/workspace
      - ./storage/sd-webui/storage/stable_diffusion/models/ckpt:/opt/stable-diffusion-webui/models/Stable-diffusion
      - ./storage/sd-webui/storage/stable_diffusion/models/lora:/opt/stable-diffusion-webui/models/Lora
      - ./storage/sd-webui/storage/stable_diffusion/models/vae:/opt/stable-diffusion-webui/models/VAE
      - ./storage/sd-webui/storage/stable_diffusion/output:/opt/stable-diffusion-webui/outputs
      # Wrapper that pip-upgrades torch to a Blackwell-capable wheel on every
      # container creation (see entrypoint above).
      - ./scripts/sd-webui-entrypoint.sh:/usr/local/bin/sd-webui-entrypoint.sh:ro
      # Persist pip download cache across container recreates so the ~2.5 GB
      # torch+CUDA wheel set is only downloaded once per host.
      - ./storage/sd-webui/pip-cache:/root/.cache/pip
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7860/sdapi/v1/options >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      # First boot clones A1111 + installs torch + xformers + downloads model
      # configs — easily 10 minutes on a fresh host. Don't fail before that.
      start_period: 900s

  # Nemotron Parse v1.2 (NVIDIA) — vision-encoder-decoder document parser
  # used by the Phase 3 RAG benchmark evaluation. NOT part of the autostart
  # chain: omitted from `restart` policy intentionally so it only runs when
  # explicitly brought up for an extraction job (`docker compose up -d
  # nemo-parse`). Heavy GPU + first-boot — bring down when not in use.
  #
  # Architecture: ViT-H encoder + mBart decoder (<1B params). Takes rendered
  # page images (PNG/JPEG, 1024x1280 min, 2048x1664 standard) via vLLM's
  # OpenAI-compat chat completions API with image_url content; returns
  # markdown + bbox + class metadata for downstream postprocessing.
  #
  # Used by scripts/extract/extract-nemo.py to produce sidecar JSON in the
  # same shape as scripts/extract/extract.py (PyMuPDF4LLM backend) so
  # app/server.js's existing loadSidecar/chunkBlocks paths consume both
  # interchangeably. See plan: ~/.claude/plans/concurrent-scribbling-cocke.md
  nemo-parse:
    image: vllm/vllm-openai:v0.21.0-cu129-ubuntu2404
    container_name: local-llm-nemo-parse
    ports:
      - "8009:8000"
    environment:
      - HF_HOME=/cache/hf
      # Disable vLLM telemetry; we're local-only.
      - DO_NOT_TRACK=1
    volumes:
      # Persist the HF download cache so the 3.75 GB model isn't re-pulled
      # on every container creation.
      - ./storage/nemo-parse/hf-cache:/cache/hf
      # Persist pip cache so the open_clip install (~80MB + deps) doesn't
      # re-download on every recreate.
      - ./storage/nemo-parse/pip-cache:/root/.cache/pip
      # Entrypoint wrapper that pip-installs open_clip_torch (missing from
      # the upstream image but required by Parse's vision encoder). See
      # script comments for rationale + removal criterion.
      - ./scripts/nemo-parse-entrypoint.sh:/usr/local/bin/nemo-parse-entrypoint.sh:ro
    # Override the image's entrypoint with our wrapper. The original image
    # entrypoint is `vllm serve` which our wrapper invokes via `exec vllm
    # serve "$@"`, so the args in `command:` flow through unchanged.
    entrypoint: ["/bin/bash", "/usr/local/bin/nemo-parse-entrypoint.sh"]
    # vLLM serve flags from NVIDIA-Nemotron-Parse-v1.2 model card. The
    # quirky --limit-mm-per-prompt JSON needs to be passed as one string
    # (list form of `command:` avoids YAML's shell-parsing).
    command:
      - "--model"
      - "nvidia/NVIDIA-Nemotron-Parse-v1.2"
      - "--dtype"
      - "bfloat16"
      - "--max-num-seqs"
      - "8"
      - "--limit-mm-per-prompt"
      - '{"image":1}'
      - "--trust-remote-code"
      - "--port"
      - "8000"
      - "--served-model-name"
      - "nemotron-parse"
      # CRITICAL for multimodal: without this, vLLM auto-detects the chat
      # template format as 'string' for Parse and silently flattens the
      # image_url content out of the message, so the model receives only
      # the prompt sentinel text with no image -- and hallucinates content
      # unrelated to the input. 'openai' format preserves the structured
      # multi-part content array.
      - "--chat-template-content-format"
      - "openai"
    # vLLM needs increased shared memory for inter-process tensor sharing.
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5); sys.exit(0)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      # First boot pulls the ~3.75 GB model + installs from HF cache.
      # Plan for 5-10 minutes on a fresh host.
      start_period: 600s
