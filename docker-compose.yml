services:
  chroma:
    image: chromadb/chroma:0.5.5
    container_name: local-llm-chroma
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./storage/chroma:/chroma/chroma
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/heartbeat', timeout=5); sys.exit(0)"
        ]
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 20s

  rag-server:
    image: node:20-slim
    container_name: local-llm-rag-server
    restart: unless-stopped
    working_dir: /app
    network_mode: host
    volumes:
      - ./app:/app
      - ./data:/data:ro
    environment:
      - PORT=3000
      - OLLAMA_HOST=http://127.0.0.1:11434
      - CHROMA_URL=http://127.0.0.1:8000
      - DATA_DIR=/data
      - EMBEDDING_MODEL=nomic-embed-text
      # Per-collection code-aware embedder (Ollama). Used by source-tree
      # RAG collections (extract-code.py output); other collections keep
      # nomic-embed-text. Qwen3-Embedding 0.6B chosen for the first pass
      # — small (~640MB) so it co-resides with the chat models on a
      # 16 GB card, fast ingest (~5 min for nginx-sized repos), code-aware.
      # Swap to qwen3-embedding:4b or :8b for better recall on nuanced
      # architectural questions when GPU headroom allows.
      - EMBEDDING_MODEL_CODE=qwen3-embedding:8b
      # Comma-separated list of collections that route to EMBEDDING_MODEL_CODE
      # instead of EMBEDDING_MODEL. Add new code collections here.
      - EMBED_CODE_COLLECTIONS=nginx,linux-core,linux-mm,linux-fs,linux-net,linux-pci,linux-usb
      # Fast default + opt-in deep (request "<collection>!deep"). See §5.3.
      - CHAT_MODEL=gemma4:e4b
      # 2026-05-25: promoted from qwen2.5-coder:32b-instruct-q4_K_M per the
      # Nemotron RAG eval (scripts/benchmark/BENCHMARK-RESULTS.md, Phase 2).
      # MoE 3B active params → ~−24% median latency vs the old dense 32B at
      # comparable answer quality, and +1 fix on axi-intc-register when also
      # promoted to CHAT_MODEL (not done — keeps gemma4:e4b's fast-profile
      # snappiness). Q4_K_M is ~24 GB → ~16 GB GPU + ~8 GB system-RAM spill
      # on 16 GB cards. `ollama pull nemotron-3-nano:30b-a3b-q4_K_M` to seed.
      - CHAT_MODEL_DEEP=nemotron-3-nano:30b-a3b-q4_K_M
      - CHUNK_SIZE=1000
      - CHUNK_OVERLAP=200
      - CHUNK_CLAUSE_DEPTH=3
      - TOP_K_RESULTS=8
      - CHAT_NUM_CTX=12288
      - CHAT_NUM_CTX_DEEP=12288
      - TOP_K_DEEP=15
      - RAG_GROUNDING=augmented
      # Multi-query expansion (fixes recall on contrastive questions). Uses
      # the fast model for decomposition by default.
      - QUERY_EXPANSION=true
      - MAX_SUBQUERIES=5
      # Temporarily false during the 2026-05-31 code-RAG optimisation
      # bench pass — locks the corpus + server config while we A/B
      # incremental upgrades (reranker, embedder, chunker). Flip back to
      # true once the chosen pipeline is in place + remaining linux-*
      # collections ready to ingest.
      - AUTO_INGEST=false
      # Cross-encoder reranker (sidecar below). RAG degrades to fused order
      # if it is down/slow, so no depends_on is needed.
      - RERANKER_URL=http://127.0.0.1:8008/rerank
      # Phase 4 of the RAG eval: opt-in per-collection routing to the Nemotron
      # embed + rerank sidecar (scripts/nemo-rag/server.py, NOT a compose
      # service -- runs natively in WSL inside scripts/extract/.venv-nemo
      # because Nemotron multimodal models broke under vLLM in Phase 3a).
      # Only collections listed in NEMO_RAG_COLLECTIONS are routed; every
      # other collection keeps using nomic-embed + bge-reranker unchanged.
      # When the sidecar isn't running, those listed collections will fail
      # at embed time -- start the sidecar first:
      #   wsl -e bash -lc "cd /mnt/d/Projects/local-llm/scripts/extract && \
      #     . .venv-nemo/bin/activate && \
      #     export HF_HOME=/mnt/d/Projects/local-llm/storage/nemo-parse/hf-cache && \
      #     python /mnt/d/Projects/local-llm/scripts/nemo-rag/server.py"
      - NEMO_RAG_URL=http://127.0.0.1:8009
      # Per-feature opt-in lists for the Nemotron embed/rerank sidecar.
      # Empty by default after the 2026-05-25 cleanup: the full Nemotron RAG
      # path regressed `tas-vs-psfp-2` in both Phase 4 (embed+rerank) and
      # Phase 4b (rerank-only) configurations -- the rerank correctly
      # deprioritises §12.29.1 ("managed objects" config tables) for broader
      # semantic questions, kicking it out of top-15 (bge-reranker's looser
      # ordering let it just barely land at #15). See
      # scripts/benchmark/BENCHMARK-RESULTS.md. Variable lines kept so the
      # wire is discoverable for a future re-bench (e.g. a Nemotron release
      # with a text-only embedder like llama-embed-nemotron-8b).
      - NEMO_EMBED_COLLECTIONS=
      - NEMO_RERANK_COLLECTIONS=
    command: >
      sh -lc "npm install && node server.js"
    depends_on:
      chroma:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 20s
      timeout: 8s
      retries: 15
      # First boot runs `npm install` then AUTO_INGEST embeds every PDF in
      # every collection; give that a wide grace window before failures count
      # so open-webui (depends_on: rag-server healthy) isn't blocked by a
      # transient early-unhealthy state.
      start_period: 180s

  reranker:
    image: python:3.12-slim
    container_name: local-llm-reranker
    restart: unless-stopped
    working_dir: /app
    network_mode: host
    volumes:
      - ./scripts/reranker:/app
      # Persisted venv + HuggingFace model cache so torch/the reranker model
      # download only once (survives container recreate).
      - ./storage/reranker:/cache
    environment:
      - PORT=8008
      - RERANKER_MODEL=BAAI/bge-reranker-v2-m3
      - HF_HOME=/cache/hf
    command: >
      sh -lc "python -m venv /cache/venv 2>/dev/null || true;
              . /cache/venv/bin/activate;
              pip install -q --upgrade pip;
              pip install -q -r requirements.txt;
              exec python server.py"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8008/health', timeout=5); sys.exit(0)"
        ]
      interval: 20s
      timeout: 8s
      retries: 30
      # First boot pip-installs torch + downloads the reranker model.
      start_period: 600s

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: local-llm-open-webui
    restart: unless-stopped
    network_mode: host
    # Entrypoint wrapper applies a surgical upstream-bug patch on every
    # container start (SafeWebBaseLoader._fetch duplicate-kwarg issue
    # that silently kills Web Search). See script header for the why +
    # removal criterion.
    entrypoint: ["/bin/bash", "/usr/local/bin/open-webui-entrypoint.sh"]
    environment:
      - OLLAMA_BASE_URL=http://127.0.0.1:11434
      - WEBUI_AUTH=true
      - PORT=8080
      # Wire Open WebUI's image generation engine to the sd-webui container
      # below. The chat UI's "image" button on any assistant reply POSTs the
      # message text as a prompt to this endpoint. See README → "Image
      # generation". These admin settings can still be overridden per-user in
      # Settings → Images, but defaulting them avoids first-run setup.
      - ENABLE_IMAGE_GENERATION=true
      - IMAGE_GENERATION_ENGINE=automatic1111
      - AUTOMATIC1111_BASE_URL=http://127.0.0.1:7860
      - IMAGE_GENERATION_MODEL=Juggernaut-XL_v9_RunDiffusionPhoto_v2
      - IMAGE_SIZE=1024x1024
      - IMAGE_STEPS=30
      # Web search grounding via the SearXNG service below. Per-chat toggle
      # in the chat input (globe icon); off by default. ENABLE_SEARCH_QUERY_
      # GENERATION lets the LLM rephrase the user prompt into a better search
      # query before SearXNG sees it (e.g. "what's new with X" → "X news 2026"),
      # which materially improves current-affairs grounding quality.
      #
      # NOTE: Open WebUI only seeds these values into its config DB on first
      # container creation. For an already-initialised instance, also toggle
      # in Admin Panel → Settings → Web Search and save. These env vars are
      # the authoritative source for fresh installs on new machines.
      - ENABLE_WEB_SEARCH=true
      - WEB_SEARCH_ENGINE=searxng
      - SEARXNG_QUERY_URL=http://127.0.0.1:8888/search?q=<query>
      # Fetch budget per chat: top 10 SearXNG results → Playwright fetch.
      # Bumped from the OW default of 3 because the funnel narrows hard
      # (some fetched pages yield no usable text; Playwright drops cookie
      # walls that resist; YouTube/dictionary entries waste slots). 10
      # gives the rank step enough material to surface 4-6 cited sources.
      - WEB_SEARCH_RESULT_COUNT=10
      - WEB_SEARCH_CONCURRENT_REQUESTS=10
      # Drop sites that survive search ranking but consistently yield no
      # article-body text (video pages, dictionary entries, Q&A scraping
      # blocks). JSON array — OW parses it via json.loads(). The `!`
      # prefix is OW's exclude marker.
      - 'WEB_SEARCH_DOMAIN_FILTER_LIST=["!youtube.com","!youtu.be","!merriam-webster.com","!dictionary.com","!quora.com"]'
      # Top-K chunks (across PDF-RAG AND web-search retrieval) that reach
      # the chat model's context. Bumped from OW's default of 3 to widen
      # the inline-citation pool — at 3, the model often cites just one
      # source even with multiple pages fetched.
      - RAG_TOP_K=5
      - ENABLE_SEARCH_QUERY_GENERATION=true
      # Playwright loader handles cookie-consent walls (Guardian, BBC,
      # most EU/UK news) + JS-rendered SPAs that the default requests-
      # based loader can't navigate. Upstream start.sh sees this and
      # runs `playwright install chromium` if the cache is empty. We
      # mount a host volume below to persist the ~130 MB Chromium across
      # container recreates.
      - WEB_LOADER_ENGINE=playwright
    volumes:
      - ./storage/open-webui:/app/backend/data
      # Persisted Playwright browser cache (Chromium-headless-shell).
      # Without this, every `docker compose up --force-recreate` would
      # re-download ~130 MB. Empty on first start → start.sh installs.
      - ./storage/open-webui-playwright:/root/.cache/ms-playwright
      # Surgical upstream-bug patch wrapper (allow_redirects dup-kwarg).
      - ./scripts/open-webui-entrypoint.sh:/usr/local/bin/open-webui-entrypoint.sh:ro
    depends_on:
      rag-server:
        condition: service_healthy

  # SearXNG — self-hosted metasearch engine. Open WebUI's native Web Search
  # feature calls /search?format=json against this when a chat has the globe
  # icon enabled. Aggregates Google/Bing/DDG + Wikipedia/arXiv/GitHub/Stack
  # Exchange + news engines per the curated list in ./searxng/settings.yml.
  #
  # Bridge networking + ports: 8888:8080 because the container binds
  # 0.0.0.0:8080 internally; Open WebUI (host network) reaches it at
  # 127.0.0.1:8888. Same shape as sd-webui (port-mapped, not host-net).
  #
  # No depends_on to/from any other service — Open WebUI degrades gracefully
  # when SearXNG isn't yet up (Web Search calls fail until ready, same
  # pattern as rag-server treating reranker as best-effort).
  #
  # NOT LAN-exposed by design — chroma (8000) and reranker (8008) are also
  # internal-only. See design.md §9 LAN access.
  searxng:
    image: searxng/searxng:latest
    container_name: local-llm-searxng
    restart: unless-stopped
    ports:
      - "8888:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:8888/
      # Read from .env at the project root. The container's entrypoint will
      # auto-generate a key if blank, but the warning logs noise — set it
      # once via `openssl rand -hex 32` and persist in .env (gitignored).
      - SEARXNG_SECRET=${SEARXNG_SECRET:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Stable Diffusion WebUI (Automatic1111) — image-generation backend that
  # Open WebUI's per-message "image" button hits. Heavy first boot (clones
  # A1111 + installs torch + xformers, ~10 min); idle CPU thereafter, GPU only
  # during generation. Co-resident with Ollama on the GPU (see README →
  # "Image generation" for the VRAM-coexistence notes vs gemma4 / !deep).
  #
  # Not on network_mode: host because ai-dock's entrypoint binds 0.0.0.0
  # internally; a port mapping is cleaner. Open WebUI (host network) reaches
  # it via 127.0.0.1:7860 just fine.
  sd-webui:
    image: ghcr.io/ai-dock/stable-diffusion-webui:latest-cuda
    container_name: local-llm-sd-webui
    restart: unless-stopped
    ports:
      - "7860:7860"
    # See scripts/sd-webui-entrypoint.sh for the full rationale. Short version:
    # ai-dock's :latest-cuda ships torch 2.4.0+cu121 whose kernels stop at
    # sm_90, so RTX 50-series (Blackwell, sm_120) GPUs fail at generate time
    # with "no kernel image is available for execution on the device". The
    # wrapper pip-upgrades to torch 2.11.0+cu128 (which ships sm_100+sm_120
    # kernels) on every container CREATION, then hands off to ai-dock's
    # normal init.sh. Idempotent: skips when already on a cu128 torch. Pip
    # cache mount below makes repeat installs near-instant.
    entrypoint: ["/bin/bash", "/usr/local/bin/sd-webui-entrypoint.sh"]
    environment:
      # --api enables the REST surface (/sdapi/v1/*) Open WebUI calls.
      # --listen binds 0.0.0.0 so the port mapping actually reaches the WebUI.
      # --cors-allow-origins=* lets the Open WebUI browser tab POST cross-origin.
      # --no-half-vae avoids occasional black-image SDXL+VAE precision bugs.
      # --opt-sdp-attention uses PyTorch's native scaled-dot-product attention
      #   (modern, ~comparable speed to xformers). Required here because the
      #   image's prebuilt xformers (built for torch 2.4.0+cu121) is ABI-
      #   incompatible with our upgraded torch 2.11.0+cu128 and won't load.
      - WEBUI_ARGS=--api --listen --cors-allow-origins=* --no-half-vae --opt-sdp-attention
      - WEB_ENABLE_AUTH=false      # local-only stack; Open WebUI gates LAN.
      - AUTO_UPDATE=false           # pin image; no silent A1111 upgrades on boot.
      # Optional tokens for fetching gated HuggingFace / Civitai models from
      # inside the container (harmless when blank).
      - HF_TOKEN=${HF_TOKEN:-}
      - CIVITAI_TOKEN=${CIVITAI_TOKEN:-}
    volumes:
      # /workspace mount kept for ai-dock's own conventions (Jupyter notebooks,
      # auxiliary scripts) but it does NOT auto-symlink models into A1111's
      # actual model dirs — the ai-dock storage_monitor that's supposed to
      # bridge `${WORKSPACE}/storage/stable_diffusion/models/...` →
      # `/opt/stable-diffusion-webui/models/...` is not enabled in this image.
      # So below we bind-mount the host model dirs DIRECTLY into the A1111
      # paths that the upstream code reads at startup. The host layout matches
      # the workspace convention so `scripts/download-sd-models.ps1` keeps
      # working unchanged and the same `.safetensors` files appear via both
      # paths inside the container.
      - ./storage/sd-webui:/workspace
      - ./storage/sd-webui/storage/stable_diffusion/models/ckpt:/opt/stable-diffusion-webui/models/Stable-diffusion
      - ./storage/sd-webui/storage/stable_diffusion/models/lora:/opt/stable-diffusion-webui/models/Lora
      - ./storage/sd-webui/storage/stable_diffusion/models/vae:/opt/stable-diffusion-webui/models/VAE
      - ./storage/sd-webui/storage/stable_diffusion/output:/opt/stable-diffusion-webui/outputs
      # Wrapper that pip-upgrades torch to a Blackwell-capable wheel on every
      # container creation (see entrypoint above).
      - ./scripts/sd-webui-entrypoint.sh:/usr/local/bin/sd-webui-entrypoint.sh:ro
      # Persist pip download cache across container recreates so the ~2.5 GB
      # torch+CUDA wheel set is only downloaded once per host.
      - ./storage/sd-webui/pip-cache:/root/.cache/pip
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7860/sdapi/v1/options >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      # First boot clones A1111 + installs torch + xformers + downloads model
      # configs — easily 10 minutes on a fresh host. Don't fail before that.
      start_period: 900s

  # Nemotron Parse v1.2 (NVIDIA) — vision-encoder-decoder document parser.
  #
  # *** DEPRECATED — not the active extraction path. ***
  # Kept in compose with no autostart for documentation + future revival.
  # The 2026-05 Nemotron eval found vLLM's chat-completions API does NOT
  # apply Parse's bundled GenerationConfig (verified v0.14.1 + v0.21.0,
  # both produced token-collapse output). The live extractor at
  # `scripts/extract/extract-nemo.py` instead loads Parse via in-process
  # HF transformers (`AutoModel.from_pretrained(..., trust_remote_code=True)
  # + GenerationConfig.from_pretrained(...) + model.generate()`) inside
  # the host-side `scripts/extract/.venv-nemo` Python venv. That path
  # produces stable output and is what scripts/extract-nemo.ps1 invokes.
  #
  # Revival gate: a vLLM release that fixes multimodal generation_config
  # wiring. Until then `docker compose up -d nemo-parse` is intentionally
  # not a supported operation. Sidecar shape (`backend="nemotron-parse-v1.2"`,
  # same blocks schema as PyMuPDF4LLM extraction) is consumed identically
  # by app/server.js's loadSidecar/chunkBlocks pipeline, so once revived
  # this service would be a drop-in re-attempt.
  #
  # Architecture (for reference): ViT-H encoder + mBart decoder (<1B params).
  # Takes rendered page images (PNG/JPEG, 1024x1280 min, 2048x1664 standard);
  # returns markdown + bbox + class metadata for downstream postprocessing.
  #
  # Eval write-up: scripts/benchmark/BENCHMARK-RESULTS.md
  # Plan:          ~/.claude/plans/concurrent-scribbling-cocke.md
  nemo-parse:
    image: vllm/vllm-openai:v0.21.0-cu129-ubuntu2404
    container_name: local-llm-nemo-parse
    ports:
      - "8009:8000"
    environment:
      - HF_HOME=/cache/hf
      # Disable vLLM telemetry; we're local-only.
      - DO_NOT_TRACK=1
    volumes:
      # Persist the HF download cache so the 3.75 GB model isn't re-pulled
      # on every container creation.
      - ./storage/nemo-parse/hf-cache:/cache/hf
      # Persist pip cache so the open_clip install (~80MB + deps) doesn't
      # re-download on every recreate.
      - ./storage/nemo-parse/pip-cache:/root/.cache/pip
      # Entrypoint wrapper that pip-installs open_clip_torch (missing from
      # the upstream image but required by Parse's vision encoder). See
      # script comments for rationale + removal criterion.
      - ./scripts/nemo-parse-entrypoint.sh:/usr/local/bin/nemo-parse-entrypoint.sh:ro
    # Override the image's entrypoint with our wrapper. The original image
    # entrypoint is `vllm serve` which our wrapper invokes via `exec vllm
    # serve "$@"`, so the args in `command:` flow through unchanged.
    entrypoint: ["/bin/bash", "/usr/local/bin/nemo-parse-entrypoint.sh"]
    # vLLM serve flags from NVIDIA-Nemotron-Parse-v1.2 model card. The
    # quirky --limit-mm-per-prompt JSON needs to be passed as one string
    # (list form of `command:` avoids YAML's shell-parsing).
    command:
      - "--model"
      - "nvidia/NVIDIA-Nemotron-Parse-v1.2"
      - "--dtype"
      - "bfloat16"
      - "--max-num-seqs"
      - "8"
      - "--limit-mm-per-prompt"
      - '{"image":1}'
      - "--trust-remote-code"
      - "--port"
      - "8000"
      - "--served-model-name"
      - "nemotron-parse"
      # CRITICAL for multimodal: without this, vLLM auto-detects the chat
      # template format as 'string' for Parse and silently flattens the
      # image_url content out of the message, so the model receives only
      # the prompt sentinel text with no image -- and hallucinates content
      # unrelated to the input. 'openai' format preserves the structured
      # multi-part content array.
      - "--chat-template-content-format"
      - "openai"
    # vLLM needs increased shared memory for inter-process tensor sharing.
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5); sys.exit(0)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      # First boot pulls the ~3.75 GB model + installs from HF cache.
      # Plan for 5-10 minutes on a fresh host.
      start_period: 600s
